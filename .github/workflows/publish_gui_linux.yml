name: Publish Linux GUI

on:
 #push:
 #  branches: [ master ]
  workflow_dispatch:

jobs:
  publish_gui_linux:

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug]
        bundled: [true, false]
        rid: [linux-x64, linux-arm64]

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore UndertaleModToolAvalonia
    - name: Build
      run: dotnet build UndertaleModToolAvalonia --no-restore
    - name: Publish Linux GUI (${{ matrix.rid }})
      run: dotnet publish UndertaleModToolAvalonia -c ${{ matrix.configuration }} -r ${{ matrix.rid }} --self-contained ${{ matrix.bundled }} -p:PublishSingleFile=false --output GUI-${{ matrix.rid }}
    - name: Copy external files
      run: |
        cp ./README.md ./GUI-${{ matrix.rid }}/
        cp ./SCRIPTS.md ./GUI-${{ matrix.rid }}/
        cp ./LICENSE.txt ./GUI-${{ matrix.rid }}/
        rm -f ./GUI-${{ matrix.rid }}/Underanalyzer.pdb
    - name: Upload Linux GUI (${{ matrix.rid }})
      uses: actions/upload-artifact@v7
      with:
        name: GUI-${{ matrix.rid }}-isBundled-${{ matrix.bundled }}
        path: GUI-${{ matrix.rid }}
